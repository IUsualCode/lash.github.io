<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал мастера</title>
<style>
:root{--bg:#722035;--card:#fff6f4;--tx:#2b1117;--mu:#85606a;--ac:#7b1e34;--ac2:#f6dde2;--ok:#1f7a45;--bad:#b3261e;--bd:#4a0f1f;--onac:#fff;--inp:#fffdfc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0d15;--card:#3a1520;--tx:#f8e6e9;--mu:#c99aa5;--ac:#e2748f;--ac2:#55212f;--ok:#6fd49b;--bad:#ff8a7a;--bd:#6e2a3b;--onac:#2a0d15;--inp:#2a0d15}}
:root[data-theme="dark"]{--bg:#2a0d15;--card:#3a1520;--tx:#f8e6e9;--mu:#c99aa5;--ac:#e2748f;--ac2:#55212f;--ok:#6fd49b;--bad:#ff8a7a;--bd:#6e2a3b;--onac:#2a0d15;--inp:#2a0d15}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
.w{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:6px 0 12px;display:inline-block;background:var(--card);padding:6px 16px;border-radius:99px;border:2px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:3px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font-size:14px}
nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1.5px solid var(--bd);box-shadow:0 2px 0 var(--bd);border-radius:14px;padding:12px;margin:8px 0}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--inp);color:var(--tx);font:inherit}
.r{display:flex;gap:8px}.r>*{flex:1;min-width:0}
.btn{border:0;background:var(--ac);color:var(--onac);padding:11px 14px;border-radius:10px;font:inherit;font-weight:600;width:100%;margin-top:10px}
.sm{width:auto;margin:0;padding:6px 10px;font-size:13px;background:var(--ac2);color:var(--ac)}
.sm.g{color:var(--ok)}.sm.x{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}.b{font-weight:700}
.chips{display:flex;gap:6px;margin:6px 0}.chip{flex:1;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px}.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}.st .v{font-size:19px;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.tag.d{color:var(--ok)}.tag.c{color:var(--bad)}
.day{font-weight:700;margin:14px 0 2px;color:var(--tx);font-size:13px;text-transform:uppercase;display:inline-block;background:var(--card);padding:3px 12px;border-radius:99px;border:1.5px solid var(--bd)}
.hide{display:none}
html,body{overflow-x:hidden}
.card,.st{overflow-wrap:anywhere}
.row>div,.row>span{min-width:0}
input,select,textarea{max-width:100%;min-width:0}
input[type=date],input[type=time],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-height:42px;text-align:left}
select{text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
textarea{resize:vertical;display:block}
input[type=file]{font-size:13px;padding:8px}
.rw>select{flex:1 1 0}
.rw>input{flex:0 0 90px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0}
.cal b{text-align:center;font-size:11px;background:var(--card);border-radius:6px;padding:2px 0}
.cd{height:46px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;min-width:0}
.cd i{font-style:normal;font-size:10px;font-weight:700}
.cd.has{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.cd.dn{background:var(--ac2)}
.cd.td{font-weight:800;text-decoration:underline}
.cd.sl{box-shadow:0 0 0 3px var(--card);transform:scale(1.07);position:relative;z-index:1}
html{max-width:100%;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
body{position:relative;width:100%;max-width:100%;touch-action:pan-y pinch-zoom}
.w{width:100%;overflow-x:hidden;overflow-x:clip}
.grid>*{min-width:0}
.st .v{font-size:clamp(15px,5vw,19px)}
input,select,textarea{font-size:16px}
label,.mu,.b{overflow-wrap:anywhere}
#v>label,#v>.mu{display:inline-block;background:var(--card);color:var(--tx);padding:4px 10px;border-radius:10px;border:1.5px solid var(--bd)}
</style>
</head>
<body>
<div class="w">
<h1>💄 Журнал мастера</h1>
<div id="v"></div>
</div>
<nav><button data-t="a">Записи</button><button data-t="j">Журнал</button><button data-t="p">Прайс</button><button data-t="d">Копия</button></nav>
<script>
var editId=null,cm=today().slice(0,7),cd=today(),KEY="lashbrow_v1",S,tab="a",flt="up",fm=today().slice(0,7),showF=false;
var DEF={services:[
{id:1,name:"Наращивание классика",price:2500},
{id:2,name:"Наращивание 2D",price:3000},
{id:3,name:"Ламинирование ресниц",price:2000},
{id:4,name:"Ламинирование бровей",price:1800},
{id:5,name:"Коррекция бровей",price:800},
{id:6,name:"Окрашивание бровей",price:700}],appts:[],exps:[]};
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.services)S=JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function rub(n){return Math.round(n).toLocaleString("ru-RU")+" ₽"}
function fd(s){var d=new Date(s+"T00:00");return d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})}
function id(){return Date.now()+Math.floor(Math.random()*1000)}
function $(i){return document.getElementById(i)}
function render(){
 document.querySelectorAll("nav button").forEach(function(b){b.className=b.dataset.t===tab?"on":""});
 $("v").innerHTML=tab==="a"?vA():tab==="j"?vJ():tab==="d"?vD():vP();
 if(tab==="a"&&$("rows")){var ea2=editId?S.appts.filter(function(a){return a.id===editId})[0]:null;if(ea2){(ea2.items&&ea2.items.length?ea2.items:[{sid:ea2.sid,name:ea2.name,price:ea2.price}]).forEach(function(x){addRow(x)})}else addRow()}
}
function vA(){
 var t=today(),list=S.appts.filter(function(a){return flt==="all"?true:(flt==="today"?a.date===t:a.date===cd)});
 list.sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1});
 var h='<button class="btn" onclick="showF=!showF;editId=null;render()">'+(showF?"Закрыть":"+ Новая запись")+'</button>';
 if(showF){
  var ea=editId?S.appts.filter(function(a){return a.id===editId})[0]:null;var names=[];S.appts.forEach(function(a){if(names.indexOf(a.client)<0)names.push(a.client)});
  h+='<div class="card"><label>Клиент</label><input id="fc" list="cl" oninput="autoPh()" value="'+esc(ea?ea.client:"")+'"><datalist id="cl">'+names.map(function(n){return'<option value="'+esc(n)+'">'}).join("")+'</datalist>'
  +'<label>Телефон</label><input id="fp" type="tel" value="'+esc(ea?ea.phone:"")+'">'
  +'<div class="r"><div><label>Дата</label><input id="fd" type="date" value="'+(ea?ea.date:(flt==="up"?cd:t))+'"></div><div><label>Время</label><input id="ft" type="time" value="'+(ea?ea.time:"10:00")+'"></div></div>'
  +'<label>Услуги</label><div id="rows"></div><button class="btn sm" style="margin-top:6px" onclick="addRow()">+ Добавить услугу</button><div class="row b" style="margin-top:10px"><span>Итого</span><span id="tot">0 ₽</span></div>'
  
  +'<label>Заметка</label><input id="fn" value="'+esc(ea?ea.note:"")+'"><button class="btn" onclick="addA()">'+(ea?"Сохранить изменения":"Сохранить запись")+'</button></div>';
 }
 if(!showF)h+=vNear(t);h+='<div class="chips"><button class="chip '+(flt==="up"?"on":"")+'" onclick="flt=\'up\';render()">Активные</button><button class="chip '+(flt==="today"?"on":"")+'" onclick="flt=\'today\';render()">Сегодня</button><button class="chip '+(flt==="all"?"on":"")+'" onclick="flt=\'all\';render()">Все</button></div>';
 if(flt==="up")h+=vCal();if(!list.length)h+='<div class="card mu">'+(flt==="up"?fd(cd)+": записей нет, свободно":"Записей нет")+'</div>';
 var last="";
 list.forEach(function(a){
  if(a.date!==last){last=a.date;h+='<div class="day">'+fd(a.date)+'</div>'}
  h+='<div class="card"><div class="row"><div><span class="b">'+esc(a.time)+'</span> · '+esc(a.client)+'</div><span class="tag '+(a.status==="done"?"d":a.status==="cancel"?"c":"")+'">'+(a.status==="done"?"выполнена":a.status==="cancel"?"отмена":"запись")+'</span></div>'
  +'<div class="mu">'+esc(a.name)+' · '+rub(a.price)+(a.note?' · '+esc(a.note):'')+'</div>'
  +(a.phone?'<div class="mu"><a style="color:var(--ac)" href="tel:'+esc(a.phone)+'">'+esc(a.phone)+'</a></div>':'')
  +'<div class="row" style="margin-top:8px;justify-content:flex-start">'
  +(a.status!=="done"?'<button class="btn sm g" onclick="setS('+a.id+',\'done\')">✓ Выполнена</button>':'')
  +(a.status==="new"?'<button class="btn sm x" onclick="setS('+a.id+',\'cancel\')">Отмена</button>':'')
  +(a.status!=="new"?'<button class="btn sm" onclick="setS('+a.id+',\'new\')">Вернуть</button>':'')
  +''+(a.status!=="done"?'<button class="btn sm" onclick="editA('+a.id+')">✎ Изменить</button>':'')+'<button class="btn sm x" onclick="delA('+a.id+')">🗑</button></div></div>';
 });
 return h;
}
function svc(r){return S.services.filter(function(x){return String(x.id)===r.querySelector("select").value})[0]}
function items(){return Array.prototype.map.call(document.querySelectorAll("#rows>.rw"),function(r){var sl=r.querySelector("select");return{sid:+sl.value||0,name:(sl.selectedOptions[0]||{}).text||"Услуга",price:+r.querySelector("input").value||0}})}
function pick(sel){var r=sel.parentNode,s=svc(r);r.querySelector("input").value=s?s.price:"";calc()}
function addRow(it){var d=document.createElement("div");d.className="row rw";d.style.cssText="margin:4px 0;gap:6px";d.innerHTML='<select style="flex:1" onchange="pick(this)">'+S.services.map(function(s){return'<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join("")+'</select><input type="number" inputmode="numeric" oninput="calc()" style="width:90px"><button class="btn sm x" onclick="this.parentNode.remove();calc()">✕</button>';$("rows").appendChild(d);var sl=d.querySelector("select");if(it){if(sl.querySelector('option[value="'+it.sid+'"]')===null){sl.add(new Option(it.name,it.sid))}sl.value=it.sid;d.querySelector("input").value=it.price;calc()}else pick(sl)}
function calc(){var t=$("tot");if(!t)return;t.textContent=rub(items().reduce(function(a,i){return a+i.price},0))}
function autoPh(){var c=$("fc").value,a=S.appts.filter(function(x){return x.client===c&&x.phone})[0];if(a&&!$("fp").value)$("fp").value=a.phone}
function addA(){
 var c=$("fc").value.trim();if(!c){alert("Укажите клиента");return}if(!$("fd").value){alert("Укажите дату");return}
 var it=items();if(!it.length){alert("Добавьте хотя бы одну услугу");return}
 var old=editId?S.appts.filter(function(a){return a.id===editId})[0]:null;S.appts=S.appts.filter(function(a){return a.id!==editId});S.appts.push({id:old?old.id:id(),date:$("fd").value,time:$("ft").value,client:c,phone:$("fp").value.trim(),items:it,name:it.map(function(i){return i.name}).join(" + "),price:it.reduce(function(a,i){return a+i.price},0),status:old?old.status:"new",note:$("fn").value.trim()});
 save();showF=false;editId=null;render();
}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function calM(k){var p=cm.split("-");cm=ymd(new Date(+p[0],+p[1]-1+k,1)).slice(0,7);render()}
function showAll(){flt="all";render()}
function pickD(b){cd=b.dataset.d;render()}
function vNear(t){var now=Date.now(),lo=now-36e5,hi=now+864e5;
 var near=S.appts.filter(function(a){if(a.status!=="new")return false;var x=new Date(a.date+"T"+(a.time||"00:00")).getTime();return x>=lo&&x<=hi}).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1});
 return '<div class="card"><div class="b">⏰ Ближайшие 24 часа</div>'+(near.length?near.map(function(a){return '<div class="row" style="margin-top:8px"><div><span class="b">'+esc(a.time)+'</span> <span class="tag">'+(a.date===t?"сегодня":a.date<t?"вчера":"завтра")+'</span> '+esc(a.client)+'<div class="mu">'+esc(a.name)+'</div></div><div class="b">'+rub(a.price)+'</div></div>'}).join(""):'<div class="mu" style="margin-top:4px">Записей нет</div>')+'</div>'}
function vCal(){
 var p=cm.split("-"),Y=+p[0],M=+p[1]-1,off=(new Date(Y,M,1).getDay()+6)%7,dim=new Date(Y,M+1,0).getDate(),t=today(),n={},nw={};
 S.appts.forEach(function(a){if(a.status==="cancel")return;n[a.date]=(n[a.date]||0)+1;if(a.status==="new")nw[a.date]=1});
 var tt=new Date(Y,M,1).toLocaleDateString("ru-RU",{month:"long",year:"numeric"}).replace(/\s*г\.?$/,"");tt=tt.charAt(0).toUpperCase()+tt.slice(1);
 var od=S.appts.filter(function(a){return a.status==="new"&&a.date<t}).length;
 var h=(od?'<div class="card row"><div class="mu">⚠ Не отмечены (прошли): '+od+'</div><button class="btn sm" onclick="showAll()">Показать</button></div>':'')+'<div class="row" style="margin:6px 0"><button class="btn sm" onclick="calM(-1)">‹</button><div class="card b" style="margin:0;padding:6px 14px">'+tt+'</div><button class="btn sm" onclick="calM(1)">›</button></div><div class="cal">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(function(x){return"<b>"+x+"</b>"}).join("");
 for(var i=0;i<off;i++)h+="<span></span>";
 for(var d=1;d<=dim;d++){var s=Y+"-"+String(M+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  h+='<button class="cd'+(nw[s]?" has":n[s]?" dn":"")+(s===t?" td":"")+(s===cd?" sl":"")+'" data-d="'+s+'" onclick="pickD(this)">'+d+(n[s]?"<i>"+n[s]+"</i>":"")+"</button>"}
 return h+'</div><div class="mu">Тёмные дни — есть записи, светлые — только выполненные, пустые — свободно</div>'}
function editA(i){editId=i;showF=true;render();window.scrollTo(0,0)}
function setS(i,st){S.appts.forEach(function(a){if(a.id===i)a.status=st});save();render()}
function delA(i){if(confirm("Удалить запись?")){S.appts=S.appts.filter(function(a){return a.id!==i});save();render()}}
function vJ(){
 var done=S.appts.filter(function(a){return a.status==="done"&&a.date.slice(0,7)===fm}).sort(function(a,b){return a.date<b.date?1:-1});
 var ex=S.exps.filter(function(e){return e.date.slice(0,7)===fm}).sort(function(a,b){return a.date<b.date?1:-1});
 var inc=0,exs=0,cl={};
 done.forEach(function(a){inc+=a.price;cl[a.client]=1});
 ex.forEach(function(e){exs+=e.sum});
 var profit=inc-exs,n=done.length;
 var h='<label>Месяц</label><input type="month" value="'+fm+'" onchange="fm=this.value||fm;render()">'
 +'<div class="grid" style="margin-top:8px">'
 +'<div class="st"><div class="mu">Доход</div><div class="v">'+rub(inc)+'</div></div>'
 +'<div class="st"><div class="mu">Прибыль</div><div class="v '+(profit>=0?"pos":"neg")+'">'+rub(profit)+'</div></div>'
 +'<div class="st"><div class="mu">Расходы</div><div class="v">'+rub(exs)+'</div></div>'
 +'<div class="st"><div class="mu">Процедур / клиентов</div><div class="v">'+n+' / '+Object.keys(cl).length+'</div></div>'
 +'<div class="st"><div class="mu">Средний чек</div><div class="v">'+rub(n?inc/n:0)+'</div></div></div>'
 +'<div class="day">Выполненные процедуры</div>';
 if(!done.length)h+='<div class="card mu">Пока пусто. Отметьте запись как «Выполнена» — она попадёт сюда автоматически.</div>';
 done.forEach(function(a){h+='<div class="card row"><div><div class="b">'+esc(a.client)+'</div><div class="mu">'+fd(a.date)+' · '+esc(a.name)+'</div></div><div style="text-align:right"><div class="b">'+rub(a.price)+'</div></div></div>'});
 h+='<div class="day">Расходы</div><div class="card"><div class="r"><div><label>Дата</label><input id="ed" type="date" value="'+today()+'"></div><div><label>Сумма, ₽</label><input id="es" type="number" inputmode="numeric"></div></div><label>На что</label><input id="ec" placeholder="Материалы, аренда, реклама…"><button class="btn" onclick="addE()">Добавить расход</button></div>';
 ex.forEach(function(e){h+='<div class="card row"><div><div class="b">'+esc(e.cat)+'</div><div class="mu">'+fd(e.date)+'</div></div><div class="row"><span class="b neg">−'+rub(e.sum)+'</span><button class="btn sm x" onclick="delE('+e.id+')">🗑</button></div></div>'});
 return h;
}
function addE(){var s=+$("es").value;if(!s){alert("Укажите сумму");return}S.exps.push({id:id(),date:$("ed").value||today(),cat:$("ec").value.trim()||"Расход",sum:s});save();render()}
function delE(i){S.exps=S.exps.filter(function(e){return e.id!==i});save();render()}
function vP(){
 var h='<div class="mu">Цена подставляется в новую запись. Материалы учитывайте в расходах (вкладка «Журнал»).</div>';
 S.services.forEach(function(s){h+='<div class="card"><input value="'+esc(s.name)+'" onchange="upS('+s.id+',\'name\',this.value)"><label>Цена, ₽</label><input type="number" inputmode="numeric" value="'+s.price+'" onchange="upS('+s.id+',\'price\',+this.value)"><button class="btn sm x" style="margin-top:8px" onclick="delS('+s.id+')">Удалить</button></div>'});
 return h+'<div class="card"><label>Новая услуга</label><input id="sn"><label>Цена, ₽</label><input id="sp" type="number" inputmode="numeric"><button class="btn" onclick="addS()">Добавить услугу</button></div>';
}
function say(t){var m=$("msg");if(m)m.textContent=t}
function stdDl(name,data){try{var b=new Blob([data],{type:name.slice(-4)===".csv"?"text/csv;charset=utf-8":"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},1500);say("Файл сохранён в «Загрузки»")}catch(e){say("Не удалось сохранить файл");fail()}}
var FB=null;function fail(){if(FB)FB()}
function dl(name,data,fb){FB=fb||null;dl0(name,data)}
function dl0(name,data){if(!window.claude){stdDl(name,data);return}claude.use("downloads").then(function(d){if(!d){stdDl(name,data);return}return d.save({filename:name,data:data}).then(function(){say("Готово")},function(e){(say(e&&e.code==="declined"?"Отменено":"Не удалось сохранить"),e&&e.code==="declined"||fail())})}).catch(function(){say("Не удалось сохранить");fail()})}

 +'<div class="card"><div class="b">Журнал для Excel</div><div class="mu">Выполненные процедуры и расходы за выбранный месяц</div><input type="month" value="'+fm+'" onchange="fm=this.value||fm" style="margin-top:8px"><button class="btn" onclick="expC()">Скачать таблицу (CSV)</button></div>'
 +'<div class="card"><div class="b">Восстановить из копии</div><div class="mu">Текущие данные на этом устройстве будут заменены.</div><input type="file" accept=".json,application/json" onchange="impJ(this)" style="margin-top:8px"><textarea id="rt" rows="3" placeholder="Или вставьте сюда текст копии" style="margin-top:8px"></textarea><button class="btn" onclick="impT()">Восстановить из текста</button></div><div id="msg" class="mu" style="padding:4px"></div>'}
function expJ(){dl("zhurnal-backup-"+today()+".json",JSON.stringify(S),function(){showBk(JSON.stringify(S));say("Файл не сохранился. Скопируйте текст из поля ниже и вставьте в заметки")})}
function expC(){var rows=[["Дата","Тип","Описание","Услуга","Сумма"]],inc=0,exs=0;
 S.appts.filter(function(a){return a.status==="done"&&a.date.slice(0,7)===fm}).sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(a){inc+=a.price;rows.push([a.date,"Доход",a.client,a.name,a.price])});
 S.exps.filter(function(e){return e.date.slice(0,7)===fm}).sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(e){exs+=e.sum;rows.push([e.date,"Расход",e.cat,"",-e.sum])});
 rows.push(["","Доход итого","","",inc],["","Расходы итого","","",-exs],["","Прибыль","","",inc-exs]);
 var csv="\ufeff"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(";")}).join("\r\n");dl("zhurnal-"+fm+".csv",csv,function(){showBk(csv);say("Файл не сохранился. Скопируйте таблицу из поля выше и вставьте в Excel")})}
function impJ(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){applyImport(r.result)};r.readAsText(f)}
function showBk(t){var b=$("bk");if(!b)return;b.value=t;b.style.display="block";b.focus();b.select()}
function copyJ(){var t=JSON.stringify(S);function man(){showBk(t);var ok=false;try{ok=document.execCommand("copy")}catch(e){}say(ok?"Скопировано. Вставьте в заметки или мессенджер":"Выделите текст в поле ниже и скопируйте вручную")}try{navigator.clipboard.writeText(t).then(function(){say("Скопировано. Вставьте в заметки или мессенджер")},man)}catch(e){man()}}
function applyImport(t){try{var d=JSON.parse(t);if(!Array.isArray(d.services)||!Array.isArray(d.appts)||!Array.isArray(d.exps))throw 0;if(!confirm("Заменить текущие данные копией?"))return;S=d;save();say("Данные восстановлены")}catch(e){say("Это не похоже на копию журнала")}}
function impT(){applyImport($("rt").value)}
function upS(i,k,v){S.services.forEach(function(s){if(s.id===i)s[k]=v});save()}
function delS(i){if(confirm("Удалить услугу? Старые записи сохранятся.")){S.services=S.services.filter(function(s){return s.id!==i});save();render()}}
function addS(){var n=$("sn").value.trim();if(!n)return;S.services.push({id:id(),name:n,price:+$("sp").value||0});save();render()}
